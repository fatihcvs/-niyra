<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="color-scheme" content="light dark">
  <title>Bağlantı bekleniyor · Kampira</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f5f6f8;color:#172033;font:16px/1.6 system-ui,sans-serif}main{width:min(100%,420px);text-align:center}img{width:64px;height:64px;border-radius:18px}h1{margin:24px 0 10px;font-size:28px;line-height:1.2;letter-spacing:-.8px}p{color:#6c7385;margin:0 0 24px}button,a{min-height:48px;display:flex;align-items:center;justify-content:center;width:100%;border-radius:12px;font:600 15px/1.4 system-ui,sans-serif;text-decoration:none;cursor:pointer}button{border:0;background:#6548e8;color:#fff;padding:12px 18px}a{margin-top:10px;border:1px solid #e4e7ed;color:#495165;background:#fff}button:focus-visible,a:focus-visible{outline:3px solid #6548e8;outline-offset:4px}small{display:block;margin-top:24px;color:#6c7385;font-size:13px} @media(prefers-color-scheme:dark){body{background:#0b0d12;color:#f0f2f8}p,small{color:#9ca3b5}a{background:#141720;border-color:#2a2f3c;color:#c7cddd}button{background:#7256e8}}
  </style>
</head>
<body>
  <main>
    <img src="/app-icons/kampira-192.png" alt="Kampira" width="64" height="64">
    <h1>Bağlantını bekliyoruz</h1>
    <p>Şu anda Kampira'ya ulaşamıyoruz. İnternet bağlantını kontrol edip yeniden dene.</p>
    <button type="button" id="retry">Yeniden dene</button>
    <a href="/">Ana sayfayı aç</a>
    <small>Güncel gönderiler ve mesajlar için internet bağlantısı gerekir.</small>
  </main>
  <script>document.getElementById('retry').addEventListener('click',function(){window.location.reload()});</script>
</body>
</html>
